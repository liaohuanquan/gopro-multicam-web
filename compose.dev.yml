services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      GOPRO_DATA_DIR: /data
      GOPRO_CAPTURE_DIR: /captures
      GOPRO_CONFIG_FILE: /config/config.json
      GOPRO_SCAN_CIDRS: "${GOPRO_SCAN_CIDRS:-192.168.1.0/24}"
      GOPRO_PREVIEW_PORT_START: "8554"
      GOPRO_MEDIA_FINALIZE_DELAY_SECONDS: "${GOPRO_MEDIA_FINALIZE_DELAY_SECONDS:-15}"
    ports:
      - "8554-8561:8554-8561/udp"
    volumes:
      - gopro-data:/data
      - ./data:/captures
      - ./backend/app:/app/app
      - ./config.json:/config/config.json
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${GOPRO_WEB_PORT:-15173}:15173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  gopro-data:
  frontend-node-modules:
