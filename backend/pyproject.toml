[project]
name = "gopro-multicam-backend"
version = "0.1.0"
description = "GoPro HERO13 多机控制服务"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "opencv-python-headless>=4.11,<5",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
